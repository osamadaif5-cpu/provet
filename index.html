html,body{height:100%;background:#F5F6F9;font-family:Pv,system-ui,sans-serif;color:#1F2A44}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hide{display:none!important}
#login{position:fixed;inset:0;background:linear-gradient(165deg,#1F2A44 0%,#2C3B5F 60%,#1F2A44 100%);color:#fff;direction:ltr;overflow:auto;z-index:20}
.lw{max-width:430px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:calc(34px + env(safe-area-inset-top)) 28px 30px;min-height:100%}
.lw .ic{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.lw .wm{margin-top:16px;font-family:PvBrand,Pv,sans-serif;font-size:28px;font-weight:800;letter-spacing:8px;padding-left:8px;line-height:1.1;text-align:center}.lw .wm span{display:block;font-size:12.5px;font-weight:500;letter-spacing:7.5px;padding-left:7.5px;margin:6px -7.5px 0 -8px;color:#D2B062}
.lw .tag{font-family:PvBrand,Pv,sans-serif;font-size:14.5px;color:#E6EAF2;margin-top:8px;direction:ltr;font-weight:500;letter-spacing:.6px}
.lw .chip{background:#fff;color:#7A1F2B;font-size:12px;padding:2px 12px;border-radius:4px;margin-top:8px}
.lw .gm{margin-top:14px;width:90px;height:90px;border-radius:50%;border:3px solid #B8933A;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.3);background:#2C3B5F}
.lw .gm img{width:100%;height:100%;object-fit:cover;display:block}
.lw .gmn{font-size:16px;font-weight:700;margin-top:8px}
.lw .gold{width:60px;height:3px;background:#B8933A;border-radius:2px;margin:12px 0 14px}
.fld{width:100%;margin-bottom:12px;text-align:left}
.fld label{font-size:12.5px;color:#C9D0DD;display:block;margin-bottom:6px}
.sel,.inp{width:100%;height:48px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15.5px;color:#fff}
.inp{outline:0}.inp::placeholder{color:#8E9AB5}
.gobtn{width:100%;height:52px;border-radius:14px;background:#B8933A;color:#1F2A44;font-weight:700;font-size:17px;margin-top:8px}
.gobtn:disabled{opacity:.6}
.rem{font-size:12.5px;color:#C9D0DD;margin-top:14px;display:flex;align-items:center;gap:8px}
.lmsg{min-height:20px;font-size:13px;color:#FFB4A8;margin-top:10px;text-align:center}
.ver{margin-top:auto;padding-top:24px;font-size:12px;color:#A9B3C8;direction:ltr;display:flex;align-items:center;gap:6px;justify-content:center;text-align:center}.ver svg{width:14px;height:14px;flex:none;color:#B8933A}
#sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{background:#fff;color:#1F2A44;width:100%;max-width:470px;max-height:78vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));direction:ltr}
#sheet h3{font-size:16px;text-align:center;padding-bottom:8px;border-bottom:1px solid #EEF1F6}
#sheet .gh{font-size:11.5px;font-weight:700;color:#B8933A;letter-spacing:1px;margin:10px 0 3px}
#sheet .op{display:block;width:100%;text-align:left;font-size:14.5px;color:#2A3348;padding:9px 10px;border-radius:10px}
#sheet .op.on{background:#EEF1F6;font-weight:700;color:#1F2A44}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom));position:relative}
.top{background:#fff;color:#11263a;border-bottom:3px solid #11263a;box-shadow:inset 0 -1.5px 0 #D7B66A;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:5}
.top .ttl{font-size:18px;font-weight:700;letter-spacing:1px}
.top .ic{width:36px;height:36px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.top .bk{font-size:22px;padding:0 4px}
.hero{background:#1F2A44;color:#fff;padding:2px 18px 54px}
.hero .hi{font-size:20px;font-weight:700}
.hero .rg{font-size:16px;font-weight:700;margin-top:2px}
.hero .up{font-size:11.5px;color:#8FD3A8;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{font-size:12.5px;padding:5px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.35);color:#fff}
.chips.scr{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips.scr::-webkit-scrollbar{display:none}.chips.scr button{flex:none;white-space:nowrap}
.chips button.on{background:#B8933A;border-color:#B8933A;color:#1F2A44;font-weight:700}
.tgt{margin:-40px 14px 10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 14px rgba(31,42,68,.12);position:relative}
.tgt .tt{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.tgt .tv{color:#5B6472;font-weight:500;font-size:12px}
.bar{height:8px;background:#EEF1F6;border-radius:5px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#B8933A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 14px}
.k{background:#fff;border-radius:14px;padding:11px 12px;border-top:3px solid #1F2A44}
.k.red{border-top-color:#C0392B}.k.green{border-top-color:#2E8B57}
.kt{font-size:12px;color:#5B6472}.kv{font-size:19px;font-weight:700;margin-top:2px}
.k.red .kv{color:#B03A2E}.ks{font-size:10.5px;color:#8A93A5;min-height:14px}
.sec{font-size:14px;font-weight:700;padding:14px 18px 7px}
.list{margin:0 14px;background:#fff;border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #EEF1F6;font-size:13.5px;width:100%;text-align:right}
.li:last-child{border-bottom:0}
.li .cd{color:#B8933A;font-size:12px;min-width:56px;direction:ltr;text-align:right;font-weight:700}
.li .nm{flex:1;color:#2A3348}.li .am{font-weight:700}.li .am.red{color:#B03A2E}
.srch{margin:12px 14px 4px;display:flex}
.srch input{width:100%;height:44px;border-radius:12px;border:1px solid #DCE0E8;padding:0 14px;background:#fff;font-size:15px}
.cc{background:#fff;margin:14px;border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(31,42,68,.08)}
.cc .cid{color:#B8933A;font-weight:700;font-size:13px}
.cc .cn{font-size:18px;font-weight:700;margin-top:2px}.cc .cr{font-size:12.5px;color:#5B6472}
.cb{display:flex;justify-content:space-between;align-items:baseline;background:#F5F6F9;border-radius:12px;padding:10px 12px;margin-top:12px}
.cb span{font-size:13px;color:#5B6472}.cb b{font-size:24px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 14px}
.m{background:#fff;border-radius:12px;padding:9px 10px;display:flex;flex-direction:column}
.m span{font-size:11px;color:#5B6472}.m b{font-size:14px}.m em{font-style:normal;font-size:10.5px;color:#8A93A5}
.agb{background:#fff;margin:0 14px;border-radius:14px;padding:8px 12px}
.ag{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px}
.ag .al{width:78px;color:#5B6472}.ag .ab{flex:1;height:9px;background:#EEF1F6;border-radius:5px;overflow:hidden}
.ag .ab i{display:block;height:100%;background:#1F2A44;border-radius:5px}.ag .ab i.r{background:#C0392B}
.ag b{width:70px;text-align:left;font-size:12.5px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px}
.acts button{height:46px;border-radius:12px;font-size:13.5px;font-weight:700;background:#fff;color:#1F2A44;border:1.5px solid #1F2A44}
.acts button.p{background:#1F2A44;color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.tbl th{background:#1F2A44;color:#fff;font-weight:700;padding:7px 6px;position:sticky;top:0}
.tbl td{padding:7px 4px;border-bottom:1px solid #EEF1F6;text-align:center}
.tbl td.t{text-align:right}.tbl td:first-child,.tbl td:nth-child(3),.tbl td:nth-child(4),.tbl td:nth-child(5){white-space:nowrap}
.wrap{margin:12px 14px;border-radius:14px;overflow:auto;background:#fff}
.rframe{position:fixed;inset:0;background:#fff;z-index:15;display:flex;flex-direction:column}
.rframe iframe{flex:1;border:0;width:100%}
.fbar{display:flex;gap:8px;padding:8px 12px;background:#F4F6FA;border-bottom:1px solid #E3E7EF}.fbar button{flex:1;padding:10px 6px;border-radius:10px;background:#1F2A44;color:#fff;font-weight:700;font-size:14px}.fbar button.g{background:#1F8A4C}.fbar button:disabled{opacity:.6}.fmsg{font-size:12px;color:#1F2A44;padding:2px 12px}
.note{font-size:12.5px;color:#5B6472;padding:4px 18px}
.empty{padding:30px 18px;text-align:center;color:#8A93A5;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #E3E6EC;display:flex;justify-content:space-around;z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#8A93A5;flex:1}
nav button svg{width:22px;height:22px}
nav button.on{color:#1F2A44;font-weight:700}nav button.on svg{color:#B8933A}
.toast{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:492px;margin:0 auto;background:#2E8B57;color:#fff;font-size:13px;border-radius:12px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:40;transition:opacity .4s}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:35;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .bx{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:420px}
.modal h3{font-size:16px;margin-bottom:8px}.modal textarea{width:100%;height:110px;border:1px solid #DCE0E8;border-radius:12px;padding:10px;font-size:15px}
.modal .row{display:flex;gap:8px;margin-top:10px}.modal .row button{flex:1;height:44px;border-radius:12px;font-weight:700;border:1.5px solid #1F2A44}
.modal .row button.p{background:#1F2A44;color:#fff}
.me{background:#fff;margin:14px;border-radius:16px;padding:6px 14px}
.me .r{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #EEF1F6;font-size:14px}.me .r:last-child{border-bottom:0}
.me .r span{color:#5B6472}
.wide{display:block;margin:10px 14px;width:calc(100% - 28px);height:48px;border-radius:14px;font-weight:700;font-size:15px;background:#1F2A44;color:#fff}
.wide.o{background:#fff;color:#B03A2E;border:1.5px solid #B03A2E}
@media print{nav,.top,.acts,.noprint{display:none!important}#app{padding:0}}

<script>const MM = 96 / 25.4;

    var v = JSON.parse(LS.getItem('pvVisits') || '[]');
    return topBar('حسابي') + '<div class="me"><div class="r"><span>الدخول</span><b>' + esc(P.kind === 'mgr' ? P.who.ar : regs()[0].code + ' ' + regs()[0].ar) + '</b></div><div class="r"><span>المناطق</span><b>' + esc(regs().map(function (r) { return r.code; }).join(' · ')) + '</b></div><div class="r"><span>آخر تحديث للداتا</span><b>' + dd(P.end) + '</b></div><div class="r"><span>نسخة التطبيق</span><b>' + VER + '</b></div><div class="r"><span>زيارات متسجلة</span><b>' + v.length + '</b></div></div>'
      + (v.length ? '<button class="wide" data-act="sendv">ابعت الزيارات للمدير على الواتساب</button>' : '') + '<button class="wide o" data-act="out">تسجيل خروج</button>';
  }
  function frame(html, title) {
    var d = document.createElement('div'); d.className = 'rframe';
    d.innerHTML = topBar(title, true).replace('data-act="back"', 'data-act="closeframe"') + '<div class="fbar"><button data-act="fpdf">PDF</button><button class="g" data-act="fshare">مشاركة / واتساب</button></div><div class="fmsg"></div><iframe sandbox="allow-same-origin allow-modals allow-popups allow-downloads"></iframe>';
    document.body.appendChild(d); d.querySelector('iframe').srcdoc = html;
    var pdf = null, msg = d.querySelector('.fmsg'), name = String(title || 'PROVET').replace(/[\\/:*?"<>|]+/g, ' ').trim() + '.pdf';
    async function mk() { if (pdf) return pdf; msg.textContent = 'جاري تجهيز ملف PDF...'; try { pdf = pdfBuild(await docPages(html)); msg.textContent = ''; return pdf; } catch (e) { msg.textContent = 'ملف PDF ما اتجهزش على الموبايل ده.'; return null; } }
    function dl(b) { var u = URL.createObjectURL(new Blob([b], { type: 'application/pdf' })), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000); }
    d.addEventListener('click', async function (e) {
      if (e.target.closest('[data-act="closeframe"]')) { d.remove(); return; }
      var b = e.target.closest('[data-act="fpdf"],[data-act="fshare"]'); if (!b) return;
      b.disabled = true;
      try {
        var bytes = await mk(); if (!bytes) return;
        if (b.dataset.act === 'fshare') {
          var f = null; try { f = new File([bytes], name, { type: 'application/pdf' }); } catch (x) { f = null; }
          if (f && navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: title }); return; } catch (x) { if (x && x.name === 'AbortError') return; } }
          dl(bytes); msg.textContent = 'الملف اتنزّل. ابعته من الواتساب كمستند.'; return;
        }
        dl(bytes); msg.textContent = 'اتنزّل ' + name + ' — هتلاقيه في التنزيلات.';
      } finally { b.disabled = false; }
    });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-c],[data-act],[data-sel],[data-r],nav button'); if (!t) return;
    if (t.dataset.v) { go(t.dataset.v); return; }
    if (t.dataset.sel) { sel = t.dataset.sel; render(); return; }
    if (t.dataset.c) { var all = custsOf(); cust = all.find(function (x) { return x.id === t.dataset.c; }); back.push(view); view = 'cust'; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.r) { var p = t.dataset.r.split(':'), it = P.groups[+p[0]].items[+p[1]]; frame(it.html, it.title); return; }
    var a = t.dataset.act;
    if (a === 'back') { view = back.pop() || 'home'; render(); return; }
    if (a === 'st') { back.push('cust'); view = 'st'; render(); window.scrollTo(0, 0); return; }
    if (a === 'print') { window.print(); return; }
    if (a === 'wa') { var ph = String(cust.ph || '').replace(/\D/g, '').replace(/^0/, ''); if (!ph) { toast('مفيش رقم موبايل متسجل للعميل ده'); return; } window.open('https://wa.me/20' + ph, '_blank'); return; }
    if (a === 'visit') { visit(); return; }
    if (a === 'sendv') { sendVisits(); return; }
    if (a === 'out') { LS.removeItem('pvPw'); SS.removeItem('pvPw'); P = null; showLogin(); return; }
  });
  function visit() {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="bx"><h3>زيارة ' + esc(cust.id + ' — ' + cust.name) + '</h3><textarea placeholder="اكتب ملاحظة الزيارة (طلبية، تحصيل، شكوى…)"></textarea><div class="row"><button class="p" data-k="ok">حفظ الزيارة</button><button data-k="no">إلغاء</button></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', function (e) {
      var k = e.target.dataset.k; if (!k) return;
      if (k === 'ok') { var v = JSON.parse(LS.getItem('pvVisits') || '[]'); v.push({ d: new Date().toISOString().slice(0, 16).replace('T', ' '), c: cust.id, n: cust.name, t: m.querySelector('textarea').value.trim() }); LS.setItem('pvVisits', JSON.stringify(v)); toast('اتسجلت الزيارة على الموبايل. ابعتها من «حسابي».'); }
      m.remove();
    });
  }
  function sendVisits() {
    var v = JSON.parse(LS.getItem('pvVisits') || '[]'); if (!v.length) return;
    var txt = 'زيارات ' + (P.kind === 'mgr' ? P.who.ar : regs()[0].code + ' ' + regs()[0].ar) + ':\n' + v.map(function (x, i) { return (i + 1) + ') ' + x.d + ' — ' + x.c + ' ' + x.n + (x.t ? ' — ' + x.t : ''); }).join('\n');
    var ph = String(P.mgrPhone || '').replace(/\D/g, '').replace(/^0/, '');
    window.open('https://wa.me/' + (ph ? '20' + ph : '') + '?text=' + encodeURIComponent(txt), '_blank');
    if (confirm('اتبعتت؟ اضغط OK علشان أمسحها من الموبايل.')) { LS.removeItem('pvVisits'); render(); }
  }
  var obs = new MutationObserver(function () { var f = $('pf'); if (f && !f.srcdoc) f.srcdoc = P.prices.html; });
  obs.observe(document.documentElement, { childList: true, subtree: true });
  function start() {
    $('login').classList.add('hide'); $('app').classList.remove('hide'); $('nav').classList.remove('hide');
    sel = 'all'; if (P.kind !== 'mgr') sel = (P.regions[0] || {}).code || 'all';
    go('home');
  }

  // ---------- التشغيل والتحديث الأوتوماتيك ----------
  async function boot() {
    if ('serviceWorker' in navigator) { try { await navigator.serviceWorker.register('sw.js'); } catch (e) { /* من غير شغل أوفلاين */ } }
    try {
      var V = await getJSON('version.json'), pv = +LS.getItem('pvAppVer') || 0;
      if (pv && V.v > pv) SS.setItem('pvToast', V.notes || ' ');
      LS.setItem('pvAppVer', V.v);
      if (V.v > VER && SS.getItem('pvRl') !== String(V.v)) { SS.setItem('pvRl', String(V.v)); location.reload(); return; }
      var tn = SS.getItem('pvToast');
      if (tn != null) { SS.removeItem('pvToast'); setTimeout(function () { toast('✓ اتحدّث التطبيق' + (tn.trim() ? ' — الجديد: ' + tn : '')); }, 900); }
    } catch (e) { /* من غير نت */ }
    try { LOG = await getJSON('data/logins.json'); } catch (e) { LOG = { mgr: [], reg: [] }; }
    cur = LS.getItem('pvWho') || null;
    LS.removeItem('pvPw'); var pw = SS.getItem('pvPw'); /* 131: كل فتحة جديدة للتطبيق بتطلب كلمة السر */
    if (cur && pw) {
      try { P = await open(await getJSON('data/' + cur + '.json'), pw); start(); return; }
      catch (e) { if (e.message === 'bad-password') { LS.removeItem('pvPw'); showLogin('Your password changed. Ask your manager for the new one.'); return; } }
    }
    showLogin();
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && P) { getJSON('version.json').then(function (V) { if (V.v > VER && SS.getItem('pvRl') !== String(V.v)) { SS.setItem('pvRl', String(V.v)); location.reload(); } }).catch(function () {}); } });
  boot();
})();
</script></body></html>
